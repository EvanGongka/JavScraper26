services:
  javscraper26:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: javscraper26
    init: true
    ports:
      - "8765:8765"
    environment:
      JAVSCRAPER_MODE: service
      JAVSCRAPER_HOST: 0.0.0.0
      JAVSCRAPER_PORT: 8765
      JAVSCRAPER_DISABLE_BROWSER: "1"
      JAVSCRAPER_PROXY_ENABLED: "${JAVSCRAPER_PROXY_ENABLED:-false}"
      JAVSCRAPER_PROXY_PROTOCOL: "${JAVSCRAPER_PROXY_PROTOCOL:-http}"
      JAVSCRAPER_PROXY_HOST: "${JAVSCRAPER_PROXY_HOST:-}"
      JAVSCRAPER_PROXY_PORT: "${JAVSCRAPER_PROXY_PORT:-}"
      JAVSCRAPER_LOG_LEVEL: "${JAVSCRAPER_LOG_LEVEL:-INFO}"
      JAVSCRAPER_LOG_FILE: /var/log/javscraper/javscraper.log
      JAVSCRAPER_LOG_MAX_BYTES: "${JAVSCRAPER_LOG_MAX_BYTES:-10485760}"
      JAVSCRAPER_LOG_BACKUP_COUNT: "${JAVSCRAPER_LOG_BACKUP_COUNT:-5}"
      JAVSCRAPER_HEARTBEAT_INTERVAL: "${JAVSCRAPER_HEARTBEAT_INTERVAL:-60}"
      JAVSCRAPER_SLOW_REQUEST_MS: "${JAVSCRAPER_SLOW_REQUEST_MS:-3000}"
      JAVSCRAPER_METADATA_CACHE_MAX_ENTRIES: "${JAVSCRAPER_METADATA_CACHE_MAX_ENTRIES:-512}"
      JAVSCRAPER_METADATA_CACHE_TTL_SECONDS: "${JAVSCRAPER_METADATA_CACHE_TTL_SECONDS:-86400}"
      JAVSCRAPER_MAX_IMAGE_BYTES: "${JAVSCRAPER_MAX_IMAGE_BYTES:-26214400}"
      JAVSCRAPER_MAX_CONCURRENT_UPSTREAM: "${JAVSCRAPER_MAX_CONCURRENT_UPSTREAM:-8}"
      JAVSCRAPER_HTTP_CONNECT_TIMEOUT: "${JAVSCRAPER_HTTP_CONNECT_TIMEOUT:-10}"
      JAVSCRAPER_HTTP_READ_TIMEOUT: "${JAVSCRAPER_HTTP_READ_TIMEOUT:-30}"
      JAVSCRAPER_HTTP_RETRIES: "${JAVSCRAPER_HTTP_RETRIES:-2}"
      JAVSCRAPER_TASK_RETENTION_SECONDS: "${JAVSCRAPER_TASK_RETENTION_SECONDS:-3600}"
      JAVSCRAPER_TASK_MAX_COUNT: "${JAVSCRAPER_TASK_MAX_COUNT:-100}"
      JAVSCRAPER_TASK_LOG_MAX_ENTRIES: "${JAVSCRAPER_TASK_LOG_MAX_ENTRIES:-400}"
    volumes:
      - ./docker-data/input:/media/input
      - ./docker-data/output:/media/output
      - javscraper26_logs:/var/log/javscraper
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  javscraper26_logs:
